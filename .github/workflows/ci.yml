name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check manifest.json
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Check JavaScript syntax
        run: node --check popup.js